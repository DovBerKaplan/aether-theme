# Aether design tokens — the single source of truth for every design value.
# Read docs/DESIGN-SYSTEM.md first. Consumers:
#   theme/generators/tokens.py          (Python generators)
#   theme/generators/build_tokens_qml.py → components/shared/AetherShared/Tokens.qml
# After editing: `make tokens`.
#
# Tiers: [palette] holds raw values and is never used by components directly;
# [role.*] gives them meaning (values are palette names or "#rrggbb");
# [material] holds calibrated numbers; the rest are scales.

# ---------- tier 1: primitives ----------
[palette]
cyan-400     = "#00f2fe"
cyan-500     = "#00dce6"
cyan-900     = "#00373a"
ink-950      = "#0b0e14"
ink-900      = "#10131a"
ink-850      = "#121418"
ink-800      = "#191c22"
ink-750      = "#1c1e24"
ink-700      = "#1d2026"
ink-600      = "#2a2d34"
fog-500      = "#8d939d"
fog-300      = "#b9cacb"
fog-100      = "#e1e2eb"
fog-50       = "#eceef2"
paper-0      = "#ffffff"
paper-50     = "#f8f9fa"
paper-100    = "#f3f4f5"
graphite-950 = "#191c1d"
graphite-900 = "#1a1d20"
graphite-800 = "#2e3132"
graphite-700 = "#44474a"
graphite-500 = "#595f65"
red-200      = "#ffb4ab"
red-700      = "#ba1a1a"
amber-200    = "#ffd27a"
amber-700    = "#8a6100"
green-200    = "#7cf5c4"
green-700    = "#1e7d4f"
violet-200   = "#cdbdff"

# ---------- tier 2: semantic roles ----------
# Values match today's KDE schemes (build_colors.py) exactly.
[role.dark]
text           = "fog-100"
text-muted     = "fog-300"
accent         = "cyan-400"
accent-hover   = "cyan-500"
text-on-accent = "cyan-900"
link           = "cyan-500"
visited        = "violet-200"
surface        = "ink-900"
surface-sunken = "ink-950"
surface-alt    = "ink-800"
surface-raised = "ink-700"
negative       = "red-200"
warning        = "amber-200"
positive       = "green-200"

[role.light]
text           = "graphite-950"
text-muted     = "graphite-500"
accent         = "graphite-900"
accent-hover   = "graphite-700"
text-on-accent = "paper-0"
link           = "graphite-900"
visited        = "graphite-500"
surface        = "paper-50"
surface-sunken = "paper-0"
surface-alt    = "paper-100"
surface-raised = "paper-0"
negative       = "red-700"
warning        = "amber-700"
positive       = "green-700"

# The island and its cards are always dark (design line §1.2).
# Open decision: fog-50/fog-500 here vs fog-100/fog-300 in role.dark.
[role.island]
text        = "fog-50"
text-muted  = "fog-500"
accent      = "cyan-400"
chip        = "ink-600"
negative    = "#ff6b6b"   # low battery
attention   = "#e08a3c"   # session down / network gone (console's blinking dot)
warning     = "#c9a26d"   # warn lines in logs (softer than attention)
hero        = "paper-0"   # media play button
hero-pressed = "#dfe3e8"
body-top    = "ink-750"
body-bottom = "ink-850"

# Circle to Search wears Google's marks on purpose - its sheet posts to lens.google.com -
# so these are brand constants: fixed like a logo, they never follow the accent.
[role.lens]
ring-blue       = "#4285f4"   # the entry glow's four-stop sweep
ring-red        = "#ea4335"
ring-yellow     = "#fbbc04"
ring-green      = "#34a853"
primary         = "#a8c7fa"   # the filled "Search with Lens" chip / active glass button
primary-pressed = "#8fb4ff"
text-on-primary = "#062e6f"   # ink on the filled chip and the active glass button
selection       = "#4285f4"   # text selection and the word-highlight base

# ---------- tier 3: calibrated numbers ----------
[material]
island-body-alpha = 0.32   # clear glass: the blurred desktop tints the bar, the dock, toasts and cards
rim-alpha         = 0.09   # white hairline on dark glass
bevel-alpha       = 0.35
grain-opacity     = 0.04    # the one frost grain: island, dock, cards, console, desk button
dock-scrim        = 0.28   # live-calibrated, see DOCK-SPEC.md
dock-frost        = 0.10   # white veil; the value build_frames.py ships
# aether-dock glass: the island's material, clearer still in light mode
dock-alpha-dark   = 0.32
dock-alpha-light  = 0.28   # cool white veil over the blur: frosted glass that still reads over white content
tint-hover        = 0.08
tint-focus        = 0.10
tint-attention    = 0.14

# White-alpha steps over dark glass: resting fill, border, hover, press, strong edge; text-dim is island text at reduced alpha.
[tint]
faint    = 0.055
subtle   = 0.09
soft     = 0.13
strong   = 0.22
edge     = 0.55
text-dim = 0.78

# ---------- scales ----------
[space]   # 4-pt grid
xs  = 4
sm  = 8
md  = 12
lg  = 16
xl  = 24
xxl = 32

[radius]  # "pill" is not a number: height / 2
hair = 2
xs   = 4
sm   = 8
md   = 12
lg   = 16
xl   = 20
card = 24

[dock]    # the app bar's geometry (px); proportions follow the Android taskbar reference: icons ~60% of the bar
icon       = 44
cell-inset = 3      # hover chip's air around the icon
pad        = 11     # glass inset around the icons
gap        = 4      # between icon cells (+ 2 x cell-inset = visible gap)
radius     = 26
sep-extra  = 14     # extra air around the group hairline
home-w     = 0.25   # home indicator: fraction of the bar's length ...
home-h     = 4
home-inset = 5      # ... and its distance from the screen edge

[type]    # pixelSize; weight carries hierarchy
caption = 11
label   = 12
body    = 13
title   = 15
heading = 22
display = 28
clock   = 168

[font]
family = "Inter"
mono   = "JetBrains Mono"

[motion.duration]  # ms
micro   = 90
fast    = 120
base    = 180
slow    = 250
morph   = 450
ambient = 900

[motion.easing]    # Qt QEasingCurve names
enter   = "OutCubic"
exit    = "InCubic"
ambient = "InOutSine"
spring  = "OutBack"

