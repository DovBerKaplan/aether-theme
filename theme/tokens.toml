# App windows (Kvantum, the Aurorae titlebar, Konsole): one sheet of frosted glass - titlebar,
# toolbars and content in the same tone, the blurred desktop showing through, all corners round,
# a hairline rim all around (the owner's reference: a glass terminal). The accent is the island's
# chosen colour, filled in by system/aether-accent-sync; the generated themes carry the cyan
# below as its placeholder.
[apps]
chrome-alpha = 0.32   # the whole window's glass (Konsole's terminal.glass.opacity sits beside it)
view-alpha   = 0.32   # content = frame: one glass
view-tint    = 0.08   # the colour scheme's view background (file lists, text) over that glass: a faint veil
radius       = 12     # window corners (Aurorae top, Kvantum frame bottom)
button-size  = 22     # titlebar buttons (Aurorae): grey circles on the left - close, restore, minimise

# Kvantum [%General]: translucency and blur (reduce_window_opacity comes from apps.chrome-alpha)
[kvantum.general]
composite = "true"
translucent_windows = "true"
blurring = "true"
popup_blurring = "true"
reduce_menu_opacity = "4"
menu_blur_radius = "12"

[kvantum.hacks]
transparent_dolphin_view = "true"    # Dolphin's file list is part of the one glass
blur_translucent = "true"
