[General]
# auto = light 07:00-19:00, dark otherwise; or force "light" / "dark"
mode=auto
dayStart=7
nightStart=19
font=Inter
# 24h or 12h clock
clockFormat=HH:mm
dateFormat="dddd, MMMM d"
# aether = same ambient wallpaper as the desktop; pearl = soft dome scene
background=aether
# seconds of inactivity before the auth panel folds back to the clock
idleTimeout=30
