# Mac-style touchpad gestures for KDE Plasma (libinput-gestures).
# 3 fingers are free in KWin (it uses 4), so these don't clash with the built-in gestures.
# Actions call KDE's own shortcuts over DBus, so they work on Wayland and X11.

# Swipe between desktops (natural direction: fingers left -> desktop on the right)
gesture swipe left  3 qdbus6 org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut "Switch One Desktop to the Right"
gesture swipe right 3 qdbus6 org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut "Switch One Desktop to the Left"

# Mission Control / App Exposé
gesture swipe up    3 qdbus6 org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut "Overview"
gesture swipe down  3 qdbus6 org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut "ExposeClass"

# Launchpad (pinch in) / show desktop (spread out)
gesture pinch in  4 qdbus6 org.kde.kglobalaccel /component/plasmashell org.kde.kglobalaccel.Component.invokeShortcut "activate application launcher"
gesture pinch out 4 qdbus6 org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.invokeShortcut "Show Desktop"

# Swipe distance before a gesture fires (default 0 = libinput's own threshold)
swipe_threshold 0
